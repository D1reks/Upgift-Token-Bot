<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UPGIFT • Предрегистрация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 3D Фон -->
    <div id="stage" data-js="stage"></div>
    
    <!-- Контент -->
    <div id="app">
        <div class="container">
            <div class="logo-section">
                <h1 class="glowing-title">
                    U<span class="letter-p">P</span>GIFT
                </h1>
            </div>
            <div class="subtitle-section">
                <p class="subtitle">Предрегистрация на Whitelist токена $UG</p>
            </div>
            <div class="button-section">
                <button class="preregister-btn" id="preregisterBtn" disabled>
                    <span class="btn-text" id="btnText">Предрегистрация</span>
                    <span class="btn-loader" id="btnLoader" style="display:none;"></span>
                </button>
            </div>
            <div class="status-section" id="statusSection" style="display:none;">
                <p class="status-text" id="statusText"></p>
            </div>
        </div>
    </div>
    
    <script src="js/background.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
